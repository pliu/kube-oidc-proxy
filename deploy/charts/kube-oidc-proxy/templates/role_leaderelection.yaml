{{- if .Values.leaderElection.enabled }}
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
{{ include "kube-oidc-proxy.labels" . | indent 4 }}
  name: {{ include "kube-oidc-proxy.fullname" . }}-leader-election
rules:
- apiGroups:
  - "coordination.k8s.io"
  resources:
  - "leases"
  verbs:
  - "create"
- apiGroups:
  - "coordination.k8s.io"
  resources:
  - "leases"
  resourceNames:
  - {{ include "kube-oidc-proxy.fullname" . }}
  verbs:
  - "get"
  - "update"
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
{{ include "kube-oidc-proxy.labels" . | indent 4 }}
  name: {{ include "kube-oidc-proxy.fullname" . }}-leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kube-oidc-proxy.fullname" . }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "kube-oidc-proxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
