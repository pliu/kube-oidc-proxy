{{- if not .Values.oidc.issuers }}
{{- fail "oidc.issuers must list at least one issuer to trust" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-oidc-proxy.fullname" . }}-config
  labels:
{{ include "kube-oidc-proxy.labels" . | indent 4 }}
type: Opaque
data:
  authn.yaml: {{ dict "issuers" .Values.oidc.issuers | toYaml | b64enc }}
