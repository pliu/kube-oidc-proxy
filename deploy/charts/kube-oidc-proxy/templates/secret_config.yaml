{{- if not .Values.oidc.issuers }}
{{- fail "oidc.issuers must list at least one issuer to trust" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-oidc-proxy.fullname" . }}-config
  labels:
{{ include "kube-oidc-proxy.labels" . | indent 4 }}
type: Opaque
data:
  authn.yaml: {{ dict "issuers" .Values.oidc.issuers | toYaml | b64enc }}

{{- if .Values.ldap.enabled }}
  {{- if not .Values.ldap.config.backends }}
  {{- fail "ldap.config.backends must list at least one LDAP backend" }}
  {{- end }}
  {{- $cache := dict "namespace" (.Values.ldap.cacheNamespace | default .Release.Namespace) "scope" .Values.ldap.cacheScope }}
  {{- $config := mergeOverwrite (deepCopy .Values.ldap.config) (dict "cache" $cache) }}
  ldap.json: {{ $config | toJson | b64enc }}
{{- end }}
