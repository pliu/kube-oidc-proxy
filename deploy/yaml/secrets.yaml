apiVersion: v1
data:
  tls.crt: {{ SERVING_TLS_CERT }}
  tls.key: {{ SERVING_TLS_KEY }}
kind: Secret
metadata:
  name: kube-oidc-proxy-tls
  namespace: kube-oidc-proxy
type: kubernetes.io/tls
---
apiVersion: v1
stringData:
  # Every issuer the proxy trusts. Each takes the fields of a jwt entry of
  # kube-apiserver's --authentication-config, and signingAlgs (default
  # [RS256]).
  authn.yaml: |
    issuers:
    - issuer:
        url: {{ OIDC_ISSUER_URL }}
        audiences: [{{ OIDC_CLIENT_ID }}]
        # Only needed when the issuer's serving certificate is not trusted
        # by the host's root CAs.
        certificateAuthority: |
          {{ OIDC_CA }}
      claimMappings:
        username:
          claim: {{ OIDC_USERNAME_CLAIM }}
          prefix: ""
kind: Secret
metadata:
  name: kube-oidc-proxy-config
  namespace: kube-oidc-proxy
type: Opaque
