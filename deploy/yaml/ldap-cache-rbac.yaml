# Apply when LDAP augmentation is enabled. The LDAP cache namespace must match.
#
# Security: the proxy trusts these ConfigMaps as group memberships, unsigned.
# Any subject that can create or update ConfigMaps in this namespace can grant
# any user any non-system: group, which is equivalent to cluster-admin. Use a
# namespace dedicated to the cache and bind write access to the proxy only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-oidc-proxy-ldap-cache
  namespace: kube-oidc-proxy
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-oidc-proxy-ldap-cache
  namespace: kube-oidc-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-oidc-proxy-ldap-cache
subjects:
- kind: ServiceAccount
  name: kube-oidc-proxy
  namespace: kube-oidc-proxy
