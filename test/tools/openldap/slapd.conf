include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/inetorgperson.schema

modulepath /usr/lib/ldap
moduleload back_mdb
moduleload memberof
moduleload refint

pidfile /run/slapd/slapd.pid
argsfile /run/slapd/slapd.args

TLSCertificateFile /run/slapd/cert.pem
TLSCertificateKeyFile /run/slapd/key.pem

database mdb
maxsize 1073741824
suffix "dc=example,dc=test"
rootdn "cn=admin,dc=example,dc=test"
rootpw e2e-ldap-password
directory /var/lib/ldap

index objectClass eq
index uid eq
index cn eq
index member eq

access to attrs=userPassword
	by anonymous auth
	by * none
access to *
	by * read

# Maintain memberOf on users as groups list them in member, which is what the
# proxy reads. Like Active Directory, it holds direct memberships only.
overlay memberof
memberof-group-oc groupOfNames
memberof-member-ad member
memberof-memberof-ad memberOf
memberof-refint TRUE

overlay refint
refint_attributes member memberOf
